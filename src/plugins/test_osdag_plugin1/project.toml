[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Test 1"
version = "1.0"
license = {text = "LGPA"}
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.9.2"
]

# Entry point group `osdag.plugins` tells Osdag where to find this plugin.
[project.entry-points."osdag.plugins"]
test_plugin_1 = "test_osdag_plugin1"