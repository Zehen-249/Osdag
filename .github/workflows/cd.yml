  publish-release-assets:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build-and-publish-conda
      - publish-installer

    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      # - name: Download Linux installer
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: linux-installer
      #     path: release-assets/linux

      - name: Show assets
        run: find release-assets -type f

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          token: ${{ secrets.GITHUB_TOKEN }}

  workflow-summary:
    name: Workflow Summary 

    runs-on: ubuntu-latest
    if: always()

    needs:
    - build-and-publish-conda
    - publish-installer
    # - publish-installer-linux
    - publish-release-assets

    defaults:
      run:
        shell: bash -l {0}
    
    steps:
    - name: Generate Summary
      
      run: |
        {
        echo "# Release Pipeline Summary"
        echo ""
        echo "| Job | Status |"
        echo "|------|--------|"
        echo "| Conda Package | ${{ needs.build-and-publish-conda.result }} |"
        echo "| Windows Installer | ${{ needs.publish-installer.result }} |"
        echo "| Release Assets | ${{ needs.publish-release-assets.result }} |"
        echo ""
        echo "Generated: $(date -u)"
        } >> "$GITHUB_STEP_SUMMARY"