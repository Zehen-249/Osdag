[build-system]
requires = ["setuptools >= 61.0", "setuptools_scm >= 8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = true
where = ["src"]
include = ["osdag_core*", "osdag_gui*"]


[project]
name = "osdag"
dynamic = ["version"]
dependencies = ["PyQt5", "PySide6", "requests", "pylatex", "numpy", "PyYaml", "PyGithub", "Click", "navcube"]
requires-python = ">= 3.11,<3.13"
description = "Open steel design and graphics"
readme = "README.md"
license = "LGPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["steel design", "civil engineering", "engineering"]

[project.scripts]
osdag = "osdag_gui.__main__:main"

