[build-system]
requires = ["setuptools >= 61.0", "setuptools_scm >= 8.0"]
build-backend = "setuptools.build_meta"
include-package-date = true

[tool.setuptools.packages.find]
namespaces = true
where = ["src"]
include = ["osdag_core"]

[tool.setuptools.package-data]
"osdag_core.data.doc" = ["**/*.MD", "**/*.md", "**/*.TXT", "**/*.txt"]
"osdag_core.data.ResourceFiles.images" = ["**/*.png", "**/*.PNG", "**/*.jpg", "**/*.JPG", "**/*.jpeg", "**/*.JPEG"]
"osdag_core.data.ResourceFiles.Database" = ["*"]


[project]
name = "osdag_core"
version = "2026.01.0.0"
dependencies = []
requires-python = ">= 3.10,<3.13"
description = "Open steel design and graphics"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["steel design", "civil engineering", "engineering"]

[project.scripts]
osdag_core = "osdag_core.cli:main"

